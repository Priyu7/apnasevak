{% extends "base.html" %}

{% block content %}
<div style="max-width: 400px; margin: 40px auto; background: #fff; padding: 30px; border-radius: 12px; border: 1px solid #E2E8F0; box-shadow: 0 4px 6px rgba(0,0,0,0.03);">
    <h2 style="font-size: 1.4rem; color: #0284C7; margin-bottom: 20px; text-align: center;">लॉगिन करें (Login)</h2>
    <form method="POST">
        <div style="margin-bottom: 16px;">
            <label style="display: block; font-size: 0.9rem; margin-bottom: 6px; font-weight: 600;">फोन नंबर (Phone)</label>
            <input type="text" name="phone" required placeholder="उदा. 9876543210" style="width: 100%; padding: 10px; border: 1px solid #CBD5E1; border-radius: 6px;">
        </div>
        <div style="margin-bottom: 20px;">
            <label style="display: block; font-size: 0.9rem; margin-bottom: 6px; font-weight: 600;">पासवर्ड (Password)</label>
            <input type="password" name="password" required placeholder="पासवर्ड डालें" style="width: 100%; padding: 10px; border: 1px solid #CBD5E1; border-radius: 6px;">
        </div>
        <button type="submit" style="width: 100%; background: #0284C7; color: #fff; padding: 11px; border: none; border-radius: 6px; font-weight: 700; cursor: pointer;">Login</button>
    </form>
    <p style="text-align: center; margin-top: 16px; font-size: 0.85rem; color: #64748B;">
        नया खाता बनाना है? <a href="/signup" style="color: #0284C7; font-weight: 600;">Sign Up</a>
    </p>
</div>
{% endblock %}
