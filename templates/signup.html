{% extends "base.html" %}

{% block content %}
<div style="max-width: 440px; margin: 30px auto; background: #fff; padding: 30px; border-radius: 12px; border: 1px solid #E2E8F0; box-shadow: 0 4px 6px rgba(0,0,0,0.03);">
    <h2 style="font-size: 1.4rem; color: #0284C7; margin-bottom: 20px; text-align: center;">साइन अप करें (Register)</h2>
    <form method="POST">
        <div style="margin-bottom: 14px;">
            <label style="display: block; font-size: 0.9rem; margin-bottom: 6px; font-weight: 600;">नाम (Name)</label>
            <input type="text" name="name" required placeholder="आपका पूरा नाम" style="width: 100%; padding: 10px; border: 1px solid #CBD5E1; border-radius: 6px;">
        </div>
        <div style="margin-bottom: 14px;">
            <label style="display: block; font-size: 0.9rem; margin-bottom: 6px; font-weight: 600;">फोन नंबर (Phone)</label>
            <input type="text" name="phone" required placeholder="10 अंकों का फोन नंबर" style="width: 100%; padding: 10px; border: 1px solid #CBD5E1; border-radius: 6px;">
        </div>
        <div style="margin-bottom: 14px;">
            <label style="display: block; font-size: 0.9rem; margin-bottom: 6px; font-weight: 600;">पासवर्ड (Password)</label>
            <input type="password" name="password" required placeholder="मजबूत पासवर्ड बनाएं" style="width: 100%; padding: 10px; border: 1px solid #CBD5E1; border-radius: 6px;">
        </div>
        <div style="margin-bottom: 14px;">
            <label style="display: block; font-size: 0.9rem; margin-bottom: 6px; font-weight: 600;">रोल (Account Type)</label>
            <select name="role" id="role-select" onchange="toggleServiceType()" style="width: 100%; padding: 10px; border: 1px solid #CBD5E1; border-radius: 6px;">
                <option value="customer">ग्राहक (Customer)</option>
                <option value="sevak">सेवा प्रदाता (Service Partner)</option>
            </select>
        </div>
        <div id="service-type-field" style="margin-bottom: 20px; display: none;">
            <label style="display: block; font-size: 0.9rem; margin-bottom: 6px; font-weight: 600;">सेवा का प्रकार (Service)</label>
            <select name="service_type" style="width: 100%; padding: 10px; border: 1px solid #CBD5E1; border-radius: 6px;">
                <option value="Electrician">Electrician</option>
                <option value="Plumber">Plumber</option>
                <option value="Carpenter">Carpenter</option>
                <option value="Cleaning">Cleaning</option>
            </select>
        </div>
        <button type="submit" style="width: 100%; background: #0284C7; color: #fff; padding: 11px; border: none; border-radius: 6px; font-weight: 700; cursor: pointer;">Register</button>
    </form>
    <script>
        function toggleServiceType() {
            var role = document.getElementById("role-select").value;
            document.getElementById("service-type-field").style.display = (role === "sevak") ? "block" : "none";
        }
    </script>
</div>
{% endblock %}
