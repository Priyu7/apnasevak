{% extends "base.html" %}
{% block content %}
<style>
    .signup-stage {
        min-height: calc(100vh - 120px);
        background: radial-gradient(circle at 50% 20%, #1e293b 0%, #0b0f19 100%) !important;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 36px 16px;
        position: relative;
        overflow: hidden;
    }
    .ambient-glow-signup {
        position: absolute;
        width: 500px;
        height: 500px;
        background: radial-gradient(circle, rgba(37, 99, 235, 0.28) 0%, rgba(0,0,0,0) 70%);
        top: -90px;
        left: 50%;
        transform: translateX(-50%);
        pointer-events: none;
    }
    .ambient-glow-subtle {
        position: absolute;
        width: 400px;
        height: 400px;
        background: radial-gradient(circle, rgba(245, 158, 11, 0.16) 0%, rgba(0,0,0,0) 70%);
        bottom: -60px;
        right: 18%;
        pointer-events: none;
    }
    .pro-signup-card {
        width: 100%;
        max-width: 480px;
        background: #ffffff;
        border-radius: 28px;
        border: 1px solid rgba(255, 255, 255, 0.25);
        box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.5);
        overflow: hidden;
        position: relative;
        z-index: 2;
    }
    .pro-signup-header {
        background: linear-gradient(135deg, #090d16 0%, #1a2234 100%);
        padding: 30px 24px 22px;
        text-align: center;
        color: #ffffff;
    }
    .role-badge-pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 5px 14px;
        border-radius: 50px;
        font-size: 0.74rem;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 12px;
        background: rgba(37, 99, 235, 0.2);
        color: #93c5fd;
        border: 1px solid rgba(37, 99, 235, 0.4);
    }
    .signup-btn-action {
        background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
        color: #ffffff !important;
        border-radius: 14px;
        padding: 13px;
        font-weight: 700;
        font-size: 0.95rem;
        border: none;
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        box-shadow: 0 8px 20px -3px rgba(37, 99, 235, 0.45);
        transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .signup-btn-action:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 24px -4px rgba(37, 99, 235, 0.55);
    }
</style>

<div class="signup-stage">
    <div class="ambient-glow-signup"></div>
    <div class="ambient-glow-subtle"></div>

    <div class="pro-signup-card">
        
        <div class="pro-signup-header">
            <div class="role-badge-pill">
                <i class="bi bi-person-plus-fill"></i>
                <span>Account Onboarding</span>
            </div>

            <h3 class="fw-bold mb-1" style="font-size: 1.75rem;">
                Create Account
            </h3>
            <p class="text-white-50 small mb-0">
                Join the ApnaSevak local verified network
            </p>
        </div>

        <div class="p-4 pt-3">
            <form action="/signup" method="POST">
                
                <div class="mb-3 text-start">
                    <label class="form-label small fw-bold text-dark mb-1">Full Name</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0" style="border-radius: 14px 0 0 14px;">
                            <i class="bi bi-person text-muted"></i>
                        </span>
                        <input type="text" name="name" class="form-control bg-light border-start-0 py-2" placeholder="e.g. Priyanshu Sharma" style="border-radius: 0 14px 14px 0;" required autofocus>
                    </div>
                </div>

                <div class="mb-3 text-start">
                    <label class="form-label small fw-bold text-dark mb-1">Mobile Number</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0 fw-semibold text-secondary" style="border-radius: 14px 0 0 14px; font-size: 0.85rem;">
                            +91
                        </span>
                        <input type="tel" name="phone" pattern="[0-9]{10}" class="form-control bg-light border-start-0 py-2" placeholder="10-digit mobile number" style="border-radius: 0 14px 14px 0;" required>
                    </div>
                    <small class="text-muted" style="font-size: 0.72rem;">Used for direct calls and service updates.</small>
                </div>

                <div class="mb-3 text-start">
                    <label class="form-label small fw-bold text-dark mb-1">Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0" style="border-radius: 14px 0 0 14px;">
                            <i class="bi bi-envelope text-muted"></i>
                        </span>
                        <input type="email" name="email" class="form-control bg-light border-start-0 py-2" placeholder="name@example.com" style="border-radius: 0 14px 14px 0;" required>
                    </div>
                </div>

                <div class="mb-3 text-start">
                    <label class="form-label small fw-bold text-dark mb-1">I want to join as</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0" style="border-radius: 14px 0 0 14px;">
                            <i class="bi bi-briefcase text-muted"></i>
                        </span>
                        <select name="role" id="roleSelector" class="form-select bg-light border-start-0 py-2" style="border-radius: 0 14px 14px 0;" onchange="var el = document.getElementById('skillContainer'); if(el) { el.style.display = (this.value === 'provider') ? 'block' : 'none'; }">
                            <option value="customer">Customer (Book Home Services)</option>
                            <option value="provider">Sevak Partner (Provide Services & Earn)</option>
                        </select>
                    </div>
                </div>

                <div class="mb-3 text-start" id="skillContainer" style="display: none;">
                    <label class="form-label small fw-bold text-dark mb-1">
                        <i class="bi bi-star-fill text-warning me-1"></i> Your Primary Skill
                    </label>
                    <select name="skill_key" class="form-select bg-light py-2" style="border-radius: 14px;">
                        {% for s in services %}
                            <option value="{{ s.key }}">{{ s.title }} ({{ s.price }})</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="mb-4 text-start">
                    <label class="form-label small fw-bold text-dark mb-1">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0" style="border-radius: 14px 0 0 14px;">
                            <i class="bi bi-lock text-muted"></i>
                        </span>
                        <input type="password" name="password" class="form-control bg-light border-start-0 py-2" placeholder="Create a strong password" style="border-radius: 0 14px 14px 0;" required>
                    </div>
                </div>

                <button type="submit" class="signup-btn-action">
                    <span>Create Account</span>
                    <i class="bi bi-arrow-right"></i>
                </button>
            </form>

            <div class="text-center mt-4 pt-2 border-top">
                <p class="text-muted small mb-0">
                    Already have an account?
                    <a href="/login" class="text-primary text-decoration-none fw-bold ms-1">
                        Sign In &rarr;
                    </a>
                </p>
            </div>

            <div class="text-center mt-2">
                <a href="/" class="text-muted text-decoration-none small" style="font-size: 0.75rem;">
                    &larr; Back to portal selection
                </a>
            </div>

        </div>
    </div>
</div>
{% endblock %}
