{% extends "base.html" %}

{% block content %}
<div style="max-width: 440px; margin: 50px auto; background: #ffffff; padding: 32px; border-radius: 16px; border: 1px solid #E2E8F0; box-shadow: 0 10px 25px rgba(0,0,0,0.05);">
    
    {% if step == 'request_otp' %}
        <div style="text-align: center; margin-bottom: 24px;">
            <div style="font-size: 2.2rem; margin-bottom: 8px;">🔐</div>
            <h2 style="font-size: 1.4rem; color: #0F172A; font-weight: 700;">Password Reset</h2>
            <p style="font-size: 0.88rem; color: #64748B; margin-top: 4px;">Apna registered phone number dalein OTP paane ke liye</p>
        </div>

        <form method="POST" action="/forgot_password">
            <div style="margin-bottom: 20px;">
                <label style="display: block; font-size: 0.88rem; font-weight: 600; color: #334155; margin-bottom: 6px;">Mobile Number</label>
                <input type="text" name="phone" required placeholder="10 digit phone number" style="width: 100%; padding: 11px 14px; border: 1.5px solid #CBD5E1; border-radius: 8px; font-size: 0.95rem; outline: none;">
            </div>
            <button type="submit" style="width: 100%; background: #0284C7; color: #fff; padding: 12px; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 0.95rem;">Send OTP</button>
        </form>

    {% elif step == 'verify_otp' %}
        <div style="text-align: center; margin-bottom: 24px;">
            <div style="font-size: 2.2rem; margin-bottom: 8px;">📲</div>
            <h2 style="font-size: 1.4rem; color: #0F172A; font-weight: 700;">Verify OTP & Set Password</h2>
            <p style="font-size: 0.88rem; color: #64748B; margin-top: 4px;">Sent to <strong>+91 {{ phone }}</strong></p>
        </div>

        <form method="POST" action="/reset_password">
            <div style="margin-bottom: 16px;">
                <label style="display: block; font-size: 0.88rem; font-weight: 600; color: #334155; margin-bottom: 6px;">Enter 4-Digit OTP</label>
                <input type="text" name="otp" maxlength="4" required placeholder="4 digit OTP" style="width: 100%; padding: 11px 14px; border: 1.5px solid #CBD5E1; border-radius: 8px; font-size: 1.1rem; letter-spacing: 4px; text-align: center; font-weight: bold;">
            </div>
            <div style="margin-bottom: 16px;">
                <label style="display: block; font-size: 0.88rem; font-weight: 600; color: #334155; margin-bottom: 6px;">New Password</label>
                <input type="password" name="new_password" required placeholder="Naya password banayein" style="width: 100%; padding: 11px 14px; border: 1.5px solid #CBD5E1; border-radius: 8px; font-size: 0.95rem;">
            </div>
            <div style="margin-bottom: 22px;">
                <label style="display: block; font-size: 0.88rem; font-weight: 600; color: #334155; margin-bottom: 6px;">Confirm New Password</label>
                <input type="password" name="confirm_password" required placeholder="Dobara password dalein" style="width: 100%; padding: 11px 14px; border: 1.5px solid #CBD5E1; border-radius: 8px; font-size: 0.95rem;">
            </div>
            <button type="submit" style="width: 100%; background: #16A34A; color: #fff; padding: 12px; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 0.95rem;">Set New Password</button>
        </form>
    {% endif %}

    <div style="text-align: center; margin-top: 18px; border-top: 1px solid #F1F5F9; padding-top: 14px;">
        <a href="/login" style="color: #64748B; font-size: 0.85rem; text-decoration: none;">← Back to Login</a>
    </div>
</div>
{% endblock %}
