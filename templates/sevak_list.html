{% extends "base.html" %}

{% block content %}
<h2 style="font-size: 1.5rem; color: #0284C7; margin-bottom: 20px;">उपलब्ध सेवा प्रदाता</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px;">
    {% for s in sevaks %}
    <div style="background: #fff; border: 1px solid #E2E8F0; border-radius: 10px; padding: 18px;">
        <h3 style="font-size: 1.1rem; color: #0F172A;">{{ s.name }}</h3>
        <p style="color: #0F766E; font-weight: 600;">{{ s.service_type }}</p>
        <p style="color: #64748B; font-size: 0.9rem; margin: 8px 0;">Phone: {{ s.phone }}</p>
        <a href="/gateway?service={{ s.service_type }}" style="display: inline-block; background: #0284C7; color: #fff; padding: 6px 14px; border-radius: 6px; text-decoration: none; font-size: 0.85rem; font-weight: 600;">Book Now</a>
    </div>
    {% endfor %}
</div>
{% endblock %}
