{% extends "base.html" %}

{% block content %}
<div style="max-width: 480px; margin: 30px auto; background: #fff; padding: 30px; border-radius: 12px; border: 1px solid #E2E8F0;">
    <h2 style="font-size: 1.4rem; color: #0284C7; margin-bottom: 8px; text-align: center;">सेवा बुक करें</h2>
    <p style="text-align: center; color: #0F766E; font-weight: 700; margin-bottom: 20px;">{{ service }}</p>
    <form method="POST">
        <input type="hidden" name="service" value="{{ service }}">
        <div style="margin-bottom: 14px;">
            <label style="display: block; font-size: 0.9rem; margin-bottom: 6px; font-weight: 600;">आपका नाम</label>
            <input type="text" name="name" required placeholder="पूरा नाम दर्ज करें" style="width: 100%; padding: 10px; border: 1px solid #CBD5E1; border-radius: 6px;">
        </div>
        <div style="margin-bottom: 14px;">
            <label style="display: block; font-size: 0.9rem; margin-bottom: 6px; font-weight: 600;">फोन नंबर</label>
            <input type="text" name="phone" required placeholder="मोबाइल नंबर दर्ज करें" style="width: 100%; padding: 10px; border: 1px solid #CBD5E1; border-radius: 6px;">
        </div>
        <div style="margin-bottom: 20px;">
            <label style="display: block; font-size: 0.9rem; margin-bottom: 6px; font-weight: 600;">पूरा पता (Address)</label>
            <textarea name="address" required rows="3" placeholder="गली, मकान संख्या, लैंडमार्क..." style="width: 100%; padding: 10px; border: 1px solid #CBD5E1; border-radius: 6px;"></textarea>
        </div>
        <button type="submit" style="width: 100%; background: #0284C7; color: #fff; padding: 11px; border: none; border-radius: 6px; font-weight: 700; cursor: pointer;">ऑर्डर कन्फर्म करें</button>
    </form>
</div>
{% endblock %}
